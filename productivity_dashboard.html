<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Productivity Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
body { font-family: Arial; background: #f5f5f5; margin:0; padding:20px; }
.container { background:white; padding:20px; border-radius:12px; max-width:1000px; margin:auto; box-shadow:0 0 15px #ccc; margin-bottom:30px; }
input, select, textarea { width:100%; padding:8px; margin:5px 0 10px; border:1px solid #aaa; border-radius:6px; box-sizing:border-box; }
button { padding:6px 14px; border:none; border-radius:6px; cursor:pointer; margin:2px; }
button.add { background:#28a745; color:white; }
button.export { background:#007bff; color:white; }
button.edit { background:#ffc107; color:white; }
button.save { background:#28a745; color:white; }
button.cancel { background:#dc3545; color:white; }
table { width:100%; border-collapse:collapse; margin-top:20px; }
th, td { padding:10px; border:1px solid #ddd; text-align:center; }
th { background:#333; color:white; }
.success { color:green; font-weight:bold; }
.fail { color:red; font-weight:bold; }
.note { font-size:0.9em; color:#555; }
.subtable { width:90%; margin:5px auto; border:1px solid #bbb; border-radius:6px; }
.subtable th { background:#555; color:white; font-size:0.9em; }
.subtable td { font-size:0.9em; padding:5px; }
</style>
</head>
<body>

<div class="container">
  <h2>تتبع الإنتاجية - Productivity Tracker</h2>
  
  <label>اسم الموظف:</label>
  <select id="name">
    <option value="Nada">Nada</option>
    <option value="Mayada">Mayada</option>
    <option value="Mohamed">Mohamed</option>
    <option value="Mohamed Ashraf">Mohamed Ashraf</option>
    <option value="Hany">Hany</option>
    <option value="Hesham">Hesham</option>
    <option value="Awad">Awad</option>
    <option value="Nehal">Nehal</option>
    <option value="Abdelghany">Abdelghany</option>
  </select>

  <label>ساعات العمل:</label>
  <input type="number" id="hours" min="0" max="8">

  <label>عدد المكالمات:</label>
  <input type="number" id="calls" min="0">

  <label>نوت / ملاحظة:</label>
  <textarea id="note"></textarea>

  <label>التاريخ:</label>
  <input type="date" id="date">

  <button class="add" onclick="addRecord()">إضافة</button>
  <button class="export" onclick="exportExcel()">تصدير Excel</button>
</div>

<div class="container">
  <h2>سجلات الموظفين</h2>
  <table id="recordsTable">
    <tr>
      <th>الاسم</th>
      <th>عدد الأيام</th>
      <th>إجمالي الساعات</th>
      <th>إجمالي المكالمات</th>
      <th>المتوسط الشهري</th>
      <th>تحقيق التارجت</th>
      <th>النوت</th>
      <th>تعديل</th>
    </tr>
  </table>
</div>

<script>
let records = [];

function addRecord() {
  let name = document.getElementById("name").value;
  let hours = Number(document.getElementById("hours").value);
  let calls = Number(document.getElementById("calls").value);
  let note = document.getElementById("note").value;
  let date = document.getElementById("date").value;

  if(!hours || !calls || !date){ alert("من فضلك املأ كل البيانات الأساسية"); return; }

  let required = hours * 17;
  let achieved = calls >= required;

  records.push({ name, hours, calls, note: note||"-", date, achieved, required });
  renderTable();
  saveToLocalStorage();
}

function renderTable() {
  let table = document.getElementById("recordsTable");
  let names = ["Nada","Mayada","Mohamed","Mohamed Ashraf","Hany","Hesham","Awad","Nehal","Abdelghany"];
  table.innerHTML = `
    <tr>
      <th>الاسم</th>
      <th>عدد الأيام</th>
      <th>إجمالي الساعات</th>
      <th>إجمالي المكالمات</th>
      <th>المتوسط الشهري</th>
      <th>تحقيق التارجت</th>
      <th>النوت</th>
      <th>تعديل</th>
    </tr>
  `;
  names.forEach(name=>{
    let empRecords = records.filter(r=>r.name===name);
    let days = empRecords.length;
    let totalHours = empRecords.reduce((a,b)=>a+b.hours,0);
    let totalCalls = empRecords.reduce((a,b)=>a+b.calls,0);
    let average = days ? (totalCalls/days).toFixed(2) : 0;
    let achieved = empRecords.every(r=>r.calls>=r.required) && days>0;
    let notes = empRecords.map(r=>r.note).join(" | ") || "-";

    // الصف الرئيسي للموظف
    let row = table.insertRow(-1);
    row.innerHTML = `
      <td>${name}</td>
      <td>${days}</td>
      <td>${totalHours}</td>
      <td>${totalCalls}</td>
      <td>${average}</td>
      <td class="${achieved?'success':'fail'}">${achieved?'✔ محقق':'✘ غير محقق'}</td>
      <td class="note">${notes}</td>
      <td></td>
    `;

    // إضافة سجل يومي لكل موظف
    if(days>0){
      let subRow = table.insertRow(-1);
      let cell = subRow.insertCell(0);
      cell.colSpan = 8;
      let subTable = `<table class="subtable">
        <tr><th>التاريخ</th><th>ساعات</th><th>المكالمات</th><th>النوت</th><th>تعديل</th></tr>`;
      empRecords.forEach((r,i)=>{
        subTable += `<tr>
          <td>${r.date}</td>
          <td>${r.hours}</td>
          <td>${r.calls}</td>
          <td>${r.note}</td>
          <td><button class="edit" onclick="editDailyRecord('${name}',${i})">تعديل</button></td>
        </tr>`;
      });
      subTable += `</table>`;
      cell.innerHTML = subTable;
    }
  });
}

function editDailyRecord(name,index){
  let record = records.filter(r=>r.name===name)[index];
  if(!record) return;
  let hours = prompt("أدخل عدد الساعات الجديد", record.hours);
  let calls = prompt("أدخل عدد المكالمات الجديد", record.calls);
  if(hours!==null && calls!==null){
    record.hours = Number(hours);
    record.calls = Number(calls);
    record.required = record.hours*17;
    record.achieved = record.calls >= record.required;
    renderTable();
    saveToLocalStorage();
  }
}

function saveToLocalStorage(){ localStorage.setItem("prodData", JSON.stringify(records)); }
function loadFromLocalStorage(){
  let saved = localStorage.getItem("prodData");
  if(saved){ records=JSON.parse(saved); renderTable(); }
}

function exportExcel(){
  let table = document.getElementById("recordsTable");
  let workbook = XLSX.utils.book_new();
  let sheet = XLSX.utils.table_to_sheet(table);
  XLSX.utils.book_append_sheet(workbook,sheet,"Productivity");
  XLSX.writeFile(workbook,"productivity_report.xlsx");
}

loadFromLocalStorage();
</script>
</body>
</html>
